<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
    <script data-goatcounter="https://stop-transcoding.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <nav class="topnav">
      <a class="topnav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% unless page.permalink == "/" %}
      <a class="topnav-home" href="{{ '/' | relative_url }}">&#8592; All Devices</a>
      {% endunless %}
    </nav>
    <main class="page-main">
      <header class="page-header">
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}
          <p class="page-subtitle">{{ page.subtitle }}</p>
        {% endif %}
      </header>
      <article class="page-content">
        {{ content }}
      </article>
      <footer class="page-footer">
        <p>Built with ❤️ for Plex users.</p>
        <a href="https://stats.stop-transcoding.mstrhakr.com" target="_blank" rel="noopener">View Usage Stats</a>
      </footer>
    </main>
  </body>
</html>
